name: EC2 Deployment

on:
  workflow_dispatch:

jobs:
  deploy-ec2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: SSH into EC2 instance and run deploy script
        uses: appleboy/ssh-action@v1
        with:
          host: 10.0.0.181
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script_path: resources/deploy_ec2.sh
            cd /home/ec2-user/dice
            git pull origin AWS
            sudo systemctl restart diceapp