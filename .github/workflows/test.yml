name: Test

on:
  workflow_dispatch:
  push:
    branches: [AWS]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install -r app/requirements_flask.txt
          pip install pytest boto3 moto

      - name: Run tests
        run: pytest tests/